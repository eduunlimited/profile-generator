name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "package.json version is missing." }
          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $exists = $false
          gh release view $tag --repo ${{ github.repository }} 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          "skip=$($exists.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($exists) {
            Write-Host "Release $tag already exists; skipping build."
          } else {
            Write-Host "Will publish $tag"
          }

      - name: Setup Node
        if: steps.meta.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        if: steps.meta.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        if: steps.meta.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache portable Python
        if: steps.meta.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/python-win
          key: python-win-${{ hashFiles('requirements-camoufox.txt', 'scripts/build-portable-python.ps1') }}

      - name: Install NSIS
        if: steps.meta.outputs.skip != 'true'
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        if: steps.meta.outputs.skip != 'true'
        run: npm ci

      - name: Build Windows installer
        if: steps.meta.outputs.skip != 'true'
        env:
          LICENSE_API_URL: ${{ vars.LICENSE_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_BUNDLES: nsis
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is missing. Add it so OTA latest.json can be signed."
          }
          npm run build:release

      - name: Publish GitHub release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $asset = "release-assets/ProfileGenerator_${version}_x64-setup.exe"
          $sig = "$asset.sig"
          $manifest = "release-assets/latest.json"
          foreach ($path in @($asset, $sig, $manifest)) {
            if (-not (Test-Path $path)) { throw "Missing release asset: $path" }
          }
          gh release create $tag `
            --repo ${{ github.repository }} `
            --target ${{ github.sha }} `
            --title "Profile Generator $version" `
            --generate-notes `
            -- $asset $sig $manifest
